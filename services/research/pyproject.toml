[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research"
version = "0.1.0"
description = "RNAOS Research Platform"
requires-python = ">=3.11"

dependencies = [
    "solver",
    "optimization",
    "folding",
    "ai-intelligence",
    "rna-intelligence",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
