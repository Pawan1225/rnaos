[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaos-research"
version = "0.1.0"
description = "RNAOS Research Platform"
requires-python = ">=3.11"

dependencies = [
    "rnaos-solver",
    "rnaos-optimization",
    "rnaos-folding",
    "rnaos-ai-intelligence",
    "rnaos-rna-intelligence",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
