[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_intelligence"
version = "0.1.0"
description = "RNAOS AI Intelligence Module"
requires-python = ">=3.11"

dependencies = [
    "rna_intelligence",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
