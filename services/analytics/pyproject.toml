[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaos-analytics"
version = "0.1.0"
description = "RNAOS Analytics Platform"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "rnaos-research",
    "rnaos-decision",
    "rnaos-solver",
    "rnaos-optimization",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
