[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solver"
version = "0.1.0"
description = "RNAOS Solver Portfolio"
requires-python = ">=3.11"

dependencies = [
    "optimization",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
