[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folding"
version = "0.1.0"
description = "RNAOS RNA Folding Intelligence Service"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "ViennaRNA>=2.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
