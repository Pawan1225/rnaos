[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnaos-platform"
version = "0.1.0"
description = "RNAOS Production Platform"
requires-python = ">=3.11"

dependencies = [
    "analytics",
    "decision",
    "research",
    "solver",
    "optimization",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
