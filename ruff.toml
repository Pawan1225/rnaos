# =============================================================================
# RNAOS Ruff Configuration
# =============================================================================

target-version = "py311"
line-length = 100

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "node_modules",
]

[lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

ignore = []

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
