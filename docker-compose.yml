# Docker Compose configuration
version: "3.9"

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../deployment/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
